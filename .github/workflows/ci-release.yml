name: CI and Release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  release:
    name: Build and publish release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/pathtick_${RELEASE_TAG}_linux_amd64" ./cmd/pathtick

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/pathtick_${RELEASE_TAG}_windows_amd64.exe" ./cmd/pathtick

          cd dist
          sha256sum \
            "pathtick_${RELEASE_TAG}_linux_amd64" \
            "pathtick_${RELEASE_TAG}_windows_amd64.exe" \
            > "checksums_${RELEASE_TAG}.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
